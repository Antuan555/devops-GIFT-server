events { worker_connections 1024; }

http {
    upstream frontend_nodes {
        server 10.0.2.3:8081; 
        server 10.0.2.4:8081; 
    }

    upstream backend_nodes {
        server 10.0.2.3:8000; 
        server 10.0.2.4:8000; 
    }

    upstream redmine_nodes {
        server 10.0.2.3:8085; 
        server 10.0.2.4:8085; 
    }

    # Редирект с HTTP на HTTPS
    server {
        listen 80;
        server_name mydevopsproject.club www.mydevopsproject.club redmine.mydevopsproject.club;
        return 301 https://$host$request_uri;
    }

    # СЕРВЕР ДИПЛОМНОЙ РАБОТЫ
    server {
        listen 443 ssl;
        server_name mydevopsproject.club www.mydevopsproject.club;

        ssl_certificate /etc/nginx/ssl/example.crt;
        ssl_certificate_key /etc/nginx/ssl/example.key;

        # Бэкенд (Django API) — имеет высший приоритет
        location /api/ {
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Любые статические файлы (картинки, скрипты, css), если они запрашиваются напрямую
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Все остальные виртуальные пути (SPA-роутинг: /login, /register и т.д.)
        location / {
            proxy_pass http://frontend_nodes/index.html; # <--- Жестко проксируем на index.html фронтенда
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # СЕРВЕР REDMINE
    server {
        listen 443 ssl;
        server_name redmine.mydevopsproject.club;

        ssl_certificate /etc/nginx/ssl/example.crt;
        ssl_certificate_key /etc/nginx/ssl/example.key;

        location / {
            proxy_pass http://redmine_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
